<style>
:root{--bg:#1c0636;--bg2:#2a0a4a;--card:#3a1062;--gold:#e8c45a;--goldl:#f8e3a1;--tx:#fff;--soft:#ebddf9;--line:rgba(232,196,90,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c0636}}
:root[data-theme="dark"]{--bg:#1c0636}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 56px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#4e1884 0,var(--bg) 70%) fixed var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg2)}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
.hero{text-align:center;padding:18px 16px 8px}
.hero img{width:150px;height:150px}
.hero h1{color:var(--gold);font-size:30px;letter-spacing:.5px}
.hero p{margin:6px 0 0;color:var(--soft);font-size:15px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg2);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:10px 12px}
nav a{flex:none;color:var(--goldl);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:14px;font-weight:600}
main{max-width:640px;margin:0 auto;padding:0 14px}
section{margin-top:22px}
.bn{background:linear-gradient(90deg,#b8892b,#f8e3a1,#e8c45a,#b8892b);color:var(--bg2);text-align:center;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-radius:10px;padding:9px}
.tag{text-align:center;color:var(--gold);font-style:italic;margin:6px 0 2px;font-size:14px}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:rgba(20,4,40,.55);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:10px;color:inherit;font:inherit;cursor:pointer}
.it .t{flex:1}.it b{display:block;color:var(--goldl);font-size:17px}
.it small{display:block;color:var(--soft);font-size:14px;margin-top:3px}
.it em{display:block;color:var(--gold);font-style:normal;font-weight:700;margin-top:6px}
.ph{flex:none;width:72px;height:108px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}.shp{display:block;height:190px;max-width:100%;object-fit:contain;margin:0 auto 12px;filter:drop-shadow(0 5px 8px rgba(0,0,0,.35))}
.adb{display:inline-block;margin-top:6px;padding:3px 9px;border:1px dashed var(--gold);border-radius:999px;color:var(--goldl);font-size:12px;font-weight:600}
.avs{margin:10px 14px 0;padding:9px 12px;border-radius:12px;text-align:center;font-weight:700;font-size:14px}
.avs.on{background:rgba(46,160,90,.18);border:1px solid #3fbf74;color:#bff0d2}.avs.off{background:rgba(220,80,80,.18);border:1px solid #e06666;color:#ffd0d0}
.promo{margin:10px 14px 0;padding:10px 12px;border-radius:12px;text-align:center;background:linear-gradient(90deg,#b8892b,#f8e3a1,#e8c45a,#b8892b);color:var(--bg2);font-weight:800;font-size:14px}
.bd{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.mv{background:var(--gold);color:var(--bg2);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:800}
.pm{border:1px solid #3fbf74;color:#bff0d2;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}.dsc{color:#bff0d2}
.it.out{opacity:.45;filter:grayscale(.85);cursor:not-allowed}.up{margin:12px 0;padding:10px 12px;border:1px dashed var(--gold);border-radius:12px;color:var(--goldl);font-size:14px}
.up button{margin:8px 8px 0 0;border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}.up button.y{background:var(--gold);color:var(--bg2);font-weight:700}
.pix{margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(20,4,40,.7);border:1px solid var(--line);font-size:14px;word-break:break-all}.pix button{margin-left:8px;border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:3px 12px;font:inherit;font-size:13px}
.plus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--bg2);font-size:26px;font-weight:700;display:grid;place-items:center}
.ft{text-align:center;color:var(--soft);margin:28px 0}.ft a{color:var(--gold);font-weight:700;text-decoration:none}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
.bar button{display:flex;justify-content:space-between;width:100%;max-width:640px;margin:0 auto}
.gold{background:linear-gradient(90deg,#b8892b,#f8e3a1,#e8c45a,#b8892b);color:var(--bg2);border:0;border-radius:12px;padding:14px 18px;font:800 16px system-ui,sans-serif;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;z-index:30}.ov.on{display:flex}
.sh{width:100%;max-width:600px;margin:0 auto;max-height:92%;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sh h2{color:var(--gold);font-size:24px}.sh h3{color:var(--goldl);font-size:15px;margin:16px 0 8px}.d{color:var(--soft);margin:6px 0}
.chips{display:flex;gap:8px}.chip{flex:1;background:rgba(20,4,40,.6);border:1px solid var(--line);color:var(--soft);border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer}
.chip b{display:block;color:var(--gold)}.chip.on{background:var(--gold);color:var(--bg2)}.chip.on b{color:var(--bg2)}
.ad{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(232,196,90,.15)}
.ad span{flex:1}.ad b{color:var(--gold)}.ad input{width:20px;height:20px;accent-color:#e8c45a}
.row{display:flex;gap:12px;align-items:center;margin-top:18px}.row .gold{flex:1}
.qty{display:flex;align-items:center;gap:10px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:20px;cursor:pointer}
.ln{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(232,196,90,.2)}
.ln>div:first-child{flex:1}.ln small{display:block;color:var(--soft)}.pr{color:var(--gold);min-width:74px;text-align:right}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:800;color:var(--goldl);margin:14px 0 4px}
input[type=text],input[type=tel],select,textarea{width:100%;background:rgba(20,4,40,.7);border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:11px;font:inherit;margin-bottom:8px}
.err{color:#ff9d9d;min-height:20px;margin:6px 0}.note{color:var(--soft);font-size:13px}
#adm{--bg:#1d0636;--bg2:#2a0a4a;--card:#341160;--line:#4b2a7a;--tx:#f6efff;--mut:#b9a6d6;--gold:#e8c45a;--ok:#3fbf74;--bad:#e06666}
#adm *{box-sizing:border-box}
#adm{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
#adm header{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;padding-top:calc(14px + env(safe-area-inset-top,0px))}
#adm header h1{margin:0;font-size:1.1rem}
#adm button,#adm input,#adm select,#adm textarea{font:inherit}
#adm .btn{border:0;border-radius:10px;padding:9px 14px;background:var(--gold);color:#2a0a4a;font-weight:700;cursor:pointer}
#adm .btn.s{background:none;border:1px solid var(--gold);color:var(--gold)}
#adm .btn.r{background:none;border:1px solid var(--bad);color:#ffb3b3}
#adm .btn.sm{padding:6px 11px;font-size:13px}
#adm nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg)}
#adm nav button{flex:none;border:1px solid var(--line);background:none;color:var(--mut);border-radius:999px;padding:7px 14px;cursor:pointer}
#adm nav button.on{background:var(--gold);color:#2a0a4a;border-color:var(--gold);font-weight:700}
#adm main{max-width:760px;margin:0 auto;padding:6px 14px}
#adm .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#adm .k{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
#adm .k b{display:block;font-size:1.35rem;color:var(--gold)}
#adm .k span{color:var(--mut);font-size:13px}
#adm h2{font-size:1.05rem;margin:18px 0 8px}
#adm .cl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
#adm .cl .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#adm .cl small,#adm .mut{color:var(--mut);font-size:13px}
#adm .bar{height:10px;background:#1d0636;border-radius:99px;overflow:hidden;margin:10px 0 4px}
#adm .bar i{display:block;height:100%;background:var(--gold)}
#adm .tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
#adm .tag.g{background:var(--ok);color:#06281a}
#adm .tag.q{border:1px solid var(--gold);color:var(--gold)}
#adm .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#adm input,#adm select,#adm textarea{width:100%;background:#1d0636;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;margin:5px 0}

const fh=m=>{const h=Math.floor(m/60),mi=m%60;return mi?h+"h"+String(mi).padStart(2,"0"):h+"h"};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function agora(d=new Date()){const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Sao_Paulo",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d),g=t=>p.find(x=>x.type==t).value;return{wd:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),min:+g("hour")*60+ +g("minute")}}
function abertura(d){const{wd,min}=agora(d),h=HOR[wd];if(h&&min>=h[0]&&min<h[1])return{open:1,msg:"Aberto agora · até "+fh(h[1])};
for(let i=0;i<=7;i++){const dd=(wd+i)%7,x=HOR[dd];if(!x)continue;if(i==0&&min>=x[0])continue;return{open:0,msg:"Fechado agora · abrimos "+(i==0?"hoje":i==1?"amanhã":DN[dd])+" às "+fh(x[0])}}return{open:0,msg:"Fechado agora"}}

const tags=n=>{const t=[];if(out(n))t.push('<span class="pm" style="border-color:#e06666;color:#ffd0d0">Esgotado</span>');if(MAIS.includes(n))t.push('<span class="mv">Mais vendido</span>');if(PROMO.itens.includes(n))t.push('<span class="pm">Leve 2: -'+R(PROMO.desc)+' em cada</span>');return t.length?'<div class="bd">'+t.join("")+'</div>':""};
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $=id=>document.getElementById(id);
let cart=[],st={},F=Object.assign({tipo:"Entrega",pg:"Pix"},LS.g("imperial_f")||{}),sh=$("sh");
$("nav").innerHTML=CATS.map((c,i)=>`<a href="#c${i}">${c.t}</a>`).join("");
$("menu").innerHTML=CATS.map((c,i)=>`<section id="c${i}"><div class="bn">${c.t}</div>${c.s?`<div class="tag">${c.s}</div>`:""}${c.items.map((it,j)=>`<button class="it${out(it[0])?" out":""}" ${out(it[0])?"disabled":`onclick="openItem(${i},${j})"`}>${it[3]?`<img class="ph" src="${IMG[it[3]]}" alt="${it[0]}" loading="lazy">`:""}<div class="t"><b>${it[0]}</b>${tags(it[0])}<small>${it[1]}</small><em>a partir de ${R(it[2][0])}</em><span class="adb">${c.t=="Vitaminas"?"+ Acréscimos disponíveis":"+ Adicionais disponíveis"}</span></div>${out(it[0])?"":'<span class="plus">+</span>'}</button>`).join("")}</section>`).join("");
function openS(){$("ov").classList.add("on")}
function closeS(){$("ov").classList.remove("on")}
function openItem(ci,ii){st={ci,ii,s:0,a:new Set(),q:1,o:""};drawItem();openS()}
function drawItem(){const c=CATS[st.ci],it=c.items[st.ii];let u=it[2][st.s];st.a.forEach(i=>u+=c.ad[i][1]);st.u=u;
sh.innerHTML=`${it[3]?`<img class="shp" src="${IMG[it[3]]}" alt="${it[0]}">`:""}<h2>${it[0]}</h2><p class="d">${it[1]}</p><h3>Tamanho</h3><div class="chips">${SZ.map((z,i)=>`<button class="chip ${i==st.s?"on":""}" onclick="st.s=${i};drawItem()">${z}<b>${R(it[2][i])}</b></button>`).join("")}</div><h3>${c.t=="Vitaminas"?"Acréscimos batidos (+ R$ 1,50 cada)":"Adicionais (opcional)"}</h3>${c.ad.map((a,i)=>`<label class="ad"><input type="checkbox" ${st.a.has(i)?"checked":""} onchange="togA(${i})"><span>${a[0]}</span><b>+ ${R(a[1])}</b></label>`).join("")}<h3>Observação do copo (opcional)</h3><textarea rows="2" placeholder="Ex.: sem granola, mais leite condensado…" oninput="st.o=this.value">${esc(st.o||"")}</textarea><div class="row"><div class="qty"><button onclick="st.q=Math.max(1,st.q-1);drawItem()">−</button><span>${st.q}</span><button onclick="st.q++;drawItem()">+</button></div><button class="gold" onclick="addCart()">Adicionar · ${R(u*st.q)}</button></div>`}
function togA(i){st.a.has(i)?st.a.delete(i):st.a.add(i);drawItem()}
function calc(){const sub=cart.reduce((x,l)=>x+l.u*l.q,0),np=cart.filter(l=>PROMO.itens.includes(l.n)).reduce((x,l)=>x+l.q,0),desc=Math.floor(np/2)*2*PROMO.desc,taxa=F.tipo=="Entrega"?TAXA:0;return{sub,np,desc,taxa,total:sub-desc+taxa,falta:taxa?Math.max(0,MIN_ENTREGA-(sub-desc)):0}}
function addCart(){const c=CATS[st.ci],it=c.items[st.ii],a=[...st.a].sort().map(i=>c.ad[i][0]),o=(st.o||"").trim(),k=it[0]+SZ[st.s]+a.join()+"|"+o;
const f=cart.find(l=>l.k==k);f?f.q+=st.q:cart.push({k,n:it[0],z:SZ[st.s],a,o,u:st.u,q:st.q,ci:st.ci,ii:st.ii});closeS();bar()}
function bar(){const n=cart.reduce((x,l)=>x+l.q,0),c=calc(),b=$("bar");b.style.display=n?"block":"none";b.firstElementChild.innerHTML=`<span>Ver carrinho (${n})</span><span>${R(c.sub-c.desc)}</span>`}
function openCart(){drawCart();openS()}
function cq(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);bar();drawCart()}
function upIdx(){return cart.findIndex(l=>l.ci!==undefined&&CATS[l.ci].ad===A&&!l.a.includes("Chantilly")&&!/chantilly/i.test(CATS[l.ci].items[l.ii][1]))}
function addChant(){const i=upIdx();if(i<0)return;const l=cart[i],pr=A.find(x=>x[0]=="Chantilly")[1];l.q--;
const a=[...l.a,"Chantilly"].sort((x,y)=>A.findIndex(z=>z[0]==x)-A.findIndex(z=>z[0]==y)),k=l.n+l.z+a.join()+"|"+(l.o||""),f=cart.find(x=>x.k==k);
f?f.q++:cart.push({...l,k,a,u:l.u+pr,q:1});if(l.q<1)cart.splice(i,1);bar();drawCart()}
function copyPix(e){try{navigator.clipboard.writeText(PIX.replace(/\D/g,""));e.textContent="Copiado!"}catch(x){e.textContent="Copie manualmente"}}
function drawCart(){if(!cart.length){sh.innerHTML=`<h2>Seu carrinho</h2><p class="d">Está vazio. Escolha seus itens no cardápio.</p><button class="gold" onclick="closeS()">Ver cardápio</button>`;return}
const c=calc(),ab=abertura(),
dica=c.np%2==1?`<p class="note dsc">Adicione mais 1 ${PROMO.itens.join(" ou ")} e ganhe ${R(PROMO.desc*2)} de desconto!</p>`:"",
up=!F.nup&&upIdx()>=0?`<div class="up">Que tal turbinar? Adicione Chantilly em 1 copo por + ${R(A.find(x=>x[0]=="Chantilly")[1])}.<br><button class="y" onclick="addChant()">Adicionar</button><button onclick="F.nup=1;drawCart()">Agora não</button></div>`:"",
fd=`Cartão fidelidade: a cada ${FID} copos, 1 grátis! Contamos pelo seu telefone.`;
sh.innerHTML=`<h2>Seu pedido</h2>${cart.map((l,i)=>`<div class="ln"><div><b>${l.n}</b><small>${l.z}${l.a.length?" · + "+l.a.join(", "):""}</small>${l.o?`<small>Obs: ${esc(l.o)}</small>`:""}</div><div class="qty"><button onclick="cq(${i},-1)">−</button><span>${l.q}</span><button onclick="cq(${i},1)">+</button></div><b class="pr">${R(l.u*l.q)}</b></div>`).join("")}${up}${dica}<div class="tot" style="font-size:15px;font-weight:600"><span>Subtotal</span><span>${R(c.sub)}</span></div>${c.desc?`<div class="tot dsc" style="font-size:15px;font-weight:600;margin:4px 0"><span>Promoção leve 2</span><span>− ${R(c.desc)}</span></div>`:""}${c.taxa?`<div class="tot" style="font-size:15px;font-weight:600;margin:4px 0"><span>Taxa de entrega</span><span>${R(c.taxa)}</span></div>`:""}<div class="tot"><span>Total</span><span>${R(c.total)}</span></div>${c.falta>0?`<p class="note" style="color:#ffd0d0">Pedido mínimo para entrega: ${R(MIN_ENTREGA)}. Faltam ${R(c.falta)} (ou escolha Retirada).</p>`:""}<p class="note">${fd}</p>${ab.open?"":`<p class="note" style="color:#ffd0d0">${ab.msg}. Você pode enviar o pedido agendado e confirmamos assim que abrirmos.</p><input type="text" placeholder="Horário desejado (opcional)" value="${esc(F.quando||"")}" oninput="F.quando=this.value">`}<h3>Seus dados</h3><input type="text" placeholder="Seu nome" value="${esc(F.nome||"")}" oninput="F.nome=this.value;sv()"><input type="tel" inputmode="tel" placeholder="Seu telefone com DDD" value="${esc(F.tel||"")}" oninput="F.tel=this.value;sv()"><select onchange="F.tipo=this.value;sv();drawCart()"><option ${F.tipo=="Entrega"?"selected":""}>Entrega</option><option ${F.tipo=="Retirada"?"selected":""}>Retirada</option></select>${F.tipo=="Entrega"?`<input type="text" placeholder="Endereço completo (rua, número, bairro)" value="${esc(F.end||"")}" oninput="F.end=this.value;sv()">`:""}<select onchange="F.pg=this.value;sv();drawCart()"><option ${F.pg=="Pix"?"selected":""}>Pix</option><option ${F.pg=="Cartão"?"selected":""}>Cartão</option><option ${F.pg=="Dinheiro"?"selected":""}>Dinheiro</option></select>${F.pg=="Pix"&&PIX?`<div class="pix">Chave Pix (CNPJ): <b>${esc(PIX)}</b> · Valor: <b>${R(c.total)}</b><button onclick="copyPix(this)">Copiar chave</button></div>`:""}${F.pg=="Dinheiro"?`<input type="text" inputmode="decimal" placeholder="Troco para quanto? (vazio se não precisar)" value="${esc(F.troco||"")}" oninput="F.troco=this.value">`:""}<textarea rows="2" placeholder="Observações gerais (opcional)" oninput="F.obs=this.value">${esc(F.obs||"")}</textarea><div class="err" id="err"></div><button class="gold" style="width:100%" onclick="send()">${ab.open?"Enviar pedido pelo WhatsApp":"Enviar pedido agendado"}</button><p class="note" id="fb"></p>`}
function salvaNuvem(c,ab){if(!(SB.url&&SB.key))return;
const sig=JSON.stringify([F.tel,cart.map(l=>[l.k,l.q]),c.total]),ul=LS.g("imperial_last");if(ul&&ul.s==sig&&Date.now()-ul.t<120000)return;LS.s("imperial_last",{s:sig,t:Date.now()});
const cut=(t,n)=>String(t||"").slice(0,n);
try{fetch(SB.url+"/rest/v1/pedidos",{method:"POST",keepalive:true,headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({nome:cut(F.nome,100),tel:cut(F.tel,30),tipo:F.tipo,endereco:F.tipo=="Entrega"?cut(F.end,300):"",pagamento:F.pg,troco:F.pg=="Dinheiro"?cut(F.troco,30):"",itens:cart.map(l=>({q:l.q,n:l.n,z:l.z,a:l.a,o:cut(l.o,200),u:l.u})),copos:cart.reduce((x,l)=>x+l.q,0),subtotal:c.sub,desconto:c.desc,taxa:c.taxa,total:c.total,obs:cut(F.obs,500),agendado:!ab.open})}).catch(()=>{})}catch(e){}}
function send(){const er=m=>$("err").textContent=m,ab=abertura();
if(!(F.nome||"").trim())return er("Digite seu nome.");
if((F.tel||"").replace(/\D/g,"").length<10)return er("Digite seu telefone com DDD.");
if(F.tipo=="Entrega"&&!(F.end||"").trim())return er("Digite o endereço para entrega.");
const c=calc();if(c.falta>0)return er("Pedido mínimo para entrega: "+R(MIN_ENTREGA)+". Faltam "+R(c.falta)+" ou escolha Retirada.");
let m=(ab.open?"":`*PEDIDO AGENDADO* (loja fechada no momento)\n`)+`*Novo pedido - Açaí Imperial*\nCliente: ${F.nome.trim()}\nTelefone: ${F.tel.trim()}\nTipo: ${F.tipo}\n`+(F.tipo=="Entrega"?`Endereço: ${F.end.trim()}\n`:"")+(!ab.open&&(F.quando||"").trim()?`Horário desejado: ${F.quando.trim()}\n`:"")+`*Pagamento: ${F.pg}*`+(F.pg=="Dinheiro"?`\nTroco para: ${(F.troco||"").trim()||"não precisa"}`:"")+(F.pg=="Pix"&&PIX?`\nChave Pix (CNPJ): ${PIX}\nValor a pagar: ${R(c.total)}`:"")+`\n\n*Itens*\n`+cart.map(l=>`${l.q}x ${l.n} (${l.z})${l.a.length?" + "+l.a.join(", "):""} - ${R(l.u*l.q)}`+(l.o?`\n   Obs: ${l.o}`:"")).join("\n")+`\n\nSubtotal: ${R(c.sub)}`+(c.desc?`\nPromoção leve 2: - ${R(c.desc)}`:"")+(c.taxa?`\nTaxa de entrega: ${R(c.taxa)}`:"")+`\n*Total: ${R(c.total)}*`+(F.obs?`\nObs: ${F.obs}`:"");
const u=`https://wa.me/${WA}?text=${encodeURIComponent(m)}`;$("err").textContent="";
$("fb").innerHTML=`Abrindo o WhatsApp… Se não abrir, <a style="color:#e8c45a" href="${u}" target="_blank" rel="noopener">toque aqui</a>.`;
salvaNuvem(c,ab);
window.open(u,"_blank")}
function painel(){const x=abertura();$("aviso").className="avs "+(x.open?"on":"off");$("aviso").textContent=x.msg;
$("promo").textContent=`Promoção: leve 2 copos de ${PROMO.itens.join(" ou ")} e ganhe ${R(PROMO.desc)} de desconto em cada!`;
$("hor").innerHTML=`Segunda a sexta: ${fh(HOR[1][0])} às ${fh(HOR[1][1])} · Domingo: ${fh(HOR[0][0])} às ${fh(HOR[0][1])}<br>Entrega: ${R(TAXA)}`}
painel();setInterval(painel,60000);
(()=>{let n=0,t;const h=document.querySelector(".hero img");if(h)h.addEventListener("click",()=>{n++;clearTimeout(t);t=setTimeout(()=>n=0,2500);if(n>=5){n=0;ADM.abrir()}})})();
let ip;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ip=e;$("inst").style.display="inline-block"});
if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone)$("ios").style.display="block";
</script>
<script>
(()=>{

const $=id=>document.getElementById("adm-"+id);
const CLOUD=!!(typeof SB!=="undefined"&&SB.url&&SB.key),SBK="imp_sb_sess";
const KEY="imp_admin_v1",PK="imp_pin_v1",FID=10,TZ="America/Sao_Paulo";
const R=v=>(+v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dig=t=>String(t||"").replace(/\D/g,"");
const keyTel=t=>{let d=dig(t);if(d.startsWith("55")&&d.length>11)d=d.slice(2);return d};
const fmtTel=t=>{const d=keyTel(t);return d.length==11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length==10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:t};
const dia=ts=>new Date(ts).toLocaleDateString("pt-BR",{timeZone:TZ});
const quando=ts=>new Date(ts).toLocaleString("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});

/* ---------- dados (ficam só neste aparelho) ---------- */
let D={clients:{},orders:[]};
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.clients&&x.orders)D=x}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert("Não foi possível salvar neste navegador.")}}
const livres=c=>Math.max(0,Math.floor(c.copos/FID)-c.resg);
const prog=c=>c.copos%FID;


/* ---------- banco de dados online (Supabase) ---------- */
let SS=null,POLL=null;
async function sbAuth(body,grant){const r=await fetch(`${SB.url}/auth/v1/token?grant_type=${grant}`,{method:"POST",headers:{apikey:SB.key,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();
 if(!r.ok||!j.access_token)throw new Error("login");SS={access:j.access_token,exp:Date.now()+Math.max(60,(j.expires_in||3600)-60)*1000};localStorage.setItem(SBK,JSON.stringify({refresh:j.refresh_token}));return SS}
async function sbToken(){if(SS&&SS.exp>Date.now())return SS.access;let st=null;try{st=JSON.parse(localStorage.getItem(SBK))}catch(e){}
 if(st&&st.refresh){await sbAuth({refresh_token:st.refresh},"refresh_token");return SS.access}throw new Error("login")}
async function sb(path,opt={}){const t=await sbToken(),r=await fetch(`${SB.url}/rest/v1/${path}`,{...opt,headers:{apikey:SB.key,Authorization:"Bearer "+t,"Content-Type":"application/json",...(opt.headers||{})}});
 if(!r.ok)throw new Error(await r.text());return(r.headers.get("content-type")||"").includes("json")?r.json():null}
async function carregaNuvem(){const[p,c]=await Promise.all([sb("pedidos?select=*&order=created_at.desc&limit=500"),sb("clientes?select=*")]);
 D={clients:{},orders:[]};
 p.forEach(o=>{const ts=Date.parse(o.created_at);
  D.orders.push({id:o.id,ts,nome:o.nome,tel:o.tel,copos:o.copos,total:+o.total,tipo:o.tipo,pagamento:o.pagamento,status:o.status,endereco:o.endereco,troco:o.troco,agendado:o.agendado,obs:o.obs,
   itens:(o.itens||[]).map(i=>i.txt||(i.q+"x "+i.n+" ("+i.z+")"+(i.a&&i.a.length?" + "+i.a.join(", "):"")+(i.o?" | Obs: "+i.o:"")))});
  const k=keyTel(o.tel);if(!k)return;const cl=D.clients[k]||(D.clients[k]={nome:o.nome,tel:o.tel,copos:0,resg:0,gasto:0,pedidos:0,ultimo:0,aj:0});
  if(o.status=="confirmado"){cl.copos+=o.copos;cl.gasto+=+o.total;cl.pedidos++;cl.ultimo=Math.max(cl.ultimo,ts)}});
 c.forEach(x=>{const cl=D.clients[x.tel]||(D.clients[x.tel]={nome:x.nome||"",tel:x.tel,copos:0,resg:0,gasto:0,pedidos:0,ultimo:0,aj:0});cl.resg=x.resgatados||0;cl.aj=x.ajuste||0;cl.copos=Math.max(0,cl.copos+cl.aj);if(!cl.nome&&x.nome)cl.nome=x.nome})}
const nNovos=()=>D.orders.filter(o=>o.status=="novo").length;
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},250)}catch(e){}}
function loginNuvem(msg){$("lock").innerHTML=`<h2>Entrar no banco de dados</h2><p class="mut">Use o e-mail e a senha que você criou no Supabase.</p><input id="adm-em" type="email" placeholder="E-mail" autocomplete="username"><input id="adm-sn" type="password" placeholder="Senha" autocomplete="current-password"><div class="err" id="adm-pe">${esc(msg||"")}</div><button class="btn" style="width:100%" onclick="ADM.loginNuvem()">Entrar</button>`}
async function fazLogin(){try{await sbAuth({email:$("em").value.trim(),password:$("sn").value},"password");await abreNuvem()}catch(e){loginNuvem("E-mail ou senha incorretos.")}}
async function abreNuvem(){await carregaNuvem();$("lock").innerHTML="";$("app").style.display="block";tab("resumo");clearInterval(POLL);
 POLL=setInterval(async()=>{try{const a=nNovos();await carregaNuvem();if(nNovos()>a)beep();if(T=="resumo"||T=="pedidos")render()}catch(e){}},25000)}
async function iniciaNuvem(){try{await sbToken();await abreNuvem()}catch(e){loginNuvem()}}
const erroNuvem=()=>alert("Não consegui falar com o banco de dados. Confira a internet e tente de novo.");
const CN={
 async conf(id,st){try{await sb("pedidos?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:st})});await carregaNuvem();
  if(st=="confirmado"){const o=D.orders.find(x=>x.id==id),c=o&&D.clients[keyTel(o.tel)];if(c&&livres(c)>0)alert(`${c.nome||fmtTel(c.tel)} completou o cartão: tem ${livres(c)} copo(s) grátis!`)}render()}catch(e){erroNuvem()}},
 async cli(k,nome,resg,aj){await sb("clientes?on_conflict=tel",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify([{tel:k,nome:nome||"",resgatados:resg,ajuste:aj}])})},
 async resgatar(k){const c=D.clients[k];if(!c||!livres(c)||!confirm(`Resgatar 1 copo grátis de ${c.nome||fmtTel(c.tel)}?`))return;try{await CN.cli(k,c.nome,c.resg+1,c.aj||0);await carregaNuvem();render()}catch(e){erroNuvem()}},
 async ajusta(k,d){const c=D.clients[k];try{await CN.cli(k,c.nome,c.resg,(c.aj||0)+d);await carregaNuvem();T=="clientes"?rClientes():render()}catch(e){erroNuvem()}},
 async novoCli(){const n=$("mn").value.trim(),t=$("mt").value.trim(),k=keyTel(t);if(k.length<10)return alert("Telefone inválido. Digite com DDD.");if(D.clients[k])return alert("Esse telefone já está cadastrado.");try{await CN.cli(k,n,0,0);await carregaNuvem();tab("clientes")}catch(e){erroNuvem()}},
 async apagaPed(id){if(!confirm("Excluir este pedido?"))return;try{await sb("pedidos?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await carregaNuvem();render()}catch(e){erroNuvem()}},
 async salvaPedido(){if(!prev)return;const nome=$("pn").value.trim(),tel=$("pt").value.trim();if(keyTel(tel).length<10)return alert("Telefone inválido. Digite com DDD.");
  const copos=Math.max(0,parseInt($("pc").value)||0),total=Math.max(0,parseFloat($("pv2").value)||0);
  try{await sb("pedidos",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({nome,tel,tipo:prev.o.tipo||"",pagamento:"",itens:prev.o.itens.map(t=>({txt:t})),copos,subtotal:total,total,status:"confirmado"})});prev=null;await carregaNuvem();tab("clientes")}catch(e){erroNuvem()}},
 sair(){clearInterval(POLL);SS=null;try{localStorage.removeItem(SBK)}catch(e){}bloquear()}};

/* ---------- PIN ---------- */
async function hash(t){const s="imp|"+t;
 if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
 let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return"d"+h}
function telaLock(){const tem=localStorage.getItem(PK);$("app").style.display="none";
 $("lock").innerHTML=`<h2>${tem?"Digite seu PIN":"Crie seu PIN"}</h2><p class="mut">${tem?"Área privada do Açaí Imperial.":"De 4 a 8 números. Só quem sabe o PIN abre este painel."}</p><input id="adm-pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off"><div class="err" id="adm-pe"></div><button class="btn" style="width:100%" onclick="ADM.entrar()">${tem?"Entrar":"Salvar PIN e entrar"}</button>`;
 $("pin").addEventListener("keydown",e=>{if(e.key=="Enter")entrar()});$("pin").focus()}
async function entrar(){const v=$("pin").value.trim(),pe=$("pe"),tem=localStorage.getItem(PK);
 if(!/^\d{4,8}$/.test(v))return pe.textContent="Use de 4 a 8 números.";
 const h=await hash(v);
 if(!tem){localStorage.setItem(PK,h)}else if(tem!==h){$("pin").value="";return pe.textContent="PIN incorreto."}
 $("lock").innerHTML="";if(CLOUD)return iniciaNuvem();$("app").style.display="block";load();tab("resumo")}
function abrir(){document.getElementById("adm").style.display="block";document.getElementById("adm").scrollTop=0;telaLock()}
function bloquear(){clearInterval(POLL);D={clients:{},orders:[]};prev=null;document.getElementById('adm').style.display='none'}

/* ---------- leitura do pedido do WhatsApp ---------- */
function lerPedido(t){const g=r=>{const m=t.match(r);return m?m[1].trim():""};
 const tot=t.match(/\*?Total:\s*R\$\s*([\d.]+,\d{2})/),itens=[];let copos=0;
 (t.split(/\*Itens\*/)[1]||"").split("\n").forEach(l=>{const m=l.match(/^\s*(\d+)x\s+(.+?)\s+-\s+R\$/);if(m){copos+=+m[1];itens.push(m[1]+"x "+m[2])}});
 return{nome:g(/Cliente:\s*(.+)/),tel:g(/Telefone:\s*(.+)/),tipo:g(/Tipo:\s*(.+)/),total:tot?parseFloat(tot[1].replace(/\./g,"").replace(",",".")):0,copos,itens,agendado:/PEDIDO AGENDADO/.test(t)}}
function aplicar(o,sinal){const k=keyTel(o.tel);if(!k)return;
 const c=D.clients[k]||(D.clients[k]={nome:o.nome||"",tel:o.tel,copos:0,resg:0,gasto:0,pedidos:0,ultimo:0});
 if(sinal>0&&o.nome)c.nome=o.nome;c.copos=Math.max(0,c.copos+sinal*o.copos);c.gasto=Math.max(0,c.gasto+sinal*o.total);c.pedidos=Math.max(0,c.pedidos+sinal);
 if(sinal>0)c.ultimo=o.ts;else{const u=D.orders.filter(x=>x.id!=o.id&&keyTel(x.tel)==k).map(x=>x.ts);c.ultimo=u.length?Math.max(...u):0}}

/* ---------- telas ---------- */
let T="resumo",busca="",ord="fid",prev=null;
const TABS=[["resumo","Resumo"],["clientes","Clientes"],["registrar","Registrar pedido"],["pedidos","Pedidos"],["backup","Backup"]];
function tab(t){T=t;$("nav").innerHTML=TABS.map(([k,n])=>`<button class="${k==t?"on":""}" onclick="ADM.tab('${k}')">${n}</button>`).join("");render()}
function render(){const f={resumo:vResumo,clientes:vClientes,registrar:vRegistrar,pedidos:vPedidos,backup:vBackup}[T];$("v").innerHTML=f()}
function waLink(c,msg){return`https://wa.me/55${keyTel(c.tel)}?text=${encodeURIComponent(msg)}`}

function vResumo(){const hoje=dia(Date.now()),oh=D.orders.filter(o=>dia(o.ts)==hoje&&o.status!="cancelado"),cl=Object.entries(D.clients);
 const gratis=cl.filter(([k,c])=>livres(c)>0),quase=cl.filter(([k,c])=>livres(c)==0&&prog(c)>=FID-2&&prog(c)>0);
 const mes=D.orders.filter(o=>o.status!="cancelado"&&new Date(o.ts).toLocaleDateString("pt-BR",{timeZone:TZ,month:"2-digit",year:"numeric"})==new Date().toLocaleDateString("pt-BR",{timeZone:TZ,month:"2-digit",year:"numeric"})).reduce((x,o)=>x+o.total,0);
 const li=(arr,tx)=>arr.length?arr.map(([k,c])=>`<div class="cl"><div class="top"><div><b>${esc(c.nome||"Sem nome")}</b><br><small>${esc(fmtTel(c.tel))}</small></div><span class="tag ${livres(c)?"g":"q"}">${livres(c)?livres(c)+" grátis":prog(c)+"/"+FID}</span></div><div class="acts"><a class="btn s sm" target="_blank" rel="noopener" href="${waLink(c,tx(c))}">Chamar no WhatsApp</a>${livres(c)?`<button class="btn sm" onclick="ADM.resgatar('${k}')">Resgatar copo grátis</button>`:""}</div></div>`).join(""):`<p class="mut">Ninguém por enquanto.</p>`;
 return novosBox()+`<div class="grid"><div class="k"><b>${oh.length}</b><span>pedidos hoje</span></div><div class="k"><b>${R(oh.reduce((x,o)=>x+o.total,0))}</b><span>vendido hoje</span></div><div class="k"><b>${R(mes)}</b><span>vendido no mês</span></div><div class="k"><b>${cl.length}</b><span>clientes cadastrados</span></div></div>
 <h2>Com copo grátis para resgatar (${gratis.length})</h2>${li(gratis,c=>`Oi ${c.nome||""}! Você completou o cartão fidelidade do Açaí Imperial e tem copo grátis esperando por você. Quando quiser, é só pedir!`)}
 <h2>Quase lá (${quase.length})</h2>${li(quase,c=>`Oi ${c.nome||""}! Faltam só ${FID-prog(c)} copo(s) para você ganhar um copo grátis no Açaí Imperial.`)}`}

function vClientes(){let cl=Object.entries(D.clients);const q=busca.toLowerCase();
 if(q)cl=cl.filter(([k,c])=>(c.nome||"").toLowerCase().includes(q)||k.includes(dig(q)||"@@"));
 cl.sort((a,b)=>ord=="fid"?(livres(b[1])-livres(a[1]))||(prog(b[1])-prog(a[1])):ord=="rec"?b[1].ultimo-a[1].ultimo:ord=="gasto"?b[1].gasto-a[1].gasto:(a[1].nome||"").localeCompare(b[1].nome||""));
 return`<input placeholder="Buscar por nome ou telefone" value="${esc(busca)}" oninput="ADM.setBusca(this.value)"><select onchange="ADM.setOrd(this.value)"><option value="fid" ${ord=="fid"?"selected":""}>Mais perto do copo grátis</option><option value="rec" ${ord=="rec"?"selected":""}>Pediu mais recentemente</option><option value="gasto" ${ord=="gasto"?"selected":""}>Quem mais gastou</option><option value="nome" ${ord=="nome"?"selected":""}>Nome (A–Z)</option></select><div id="adm-lc">${listaClientes(cl)}</div>`}
function rClientes(){let cl=Object.entries(D.clients);const q=busca.toLowerCase();
 if(q)cl=cl.filter(([k,c])=>(c.nome||"").toLowerCase().includes(q)||k.includes(dig(q)||"@@"));
 cl.sort((a,b)=>ord=="fid"?(livres(b[1])-livres(a[1]))||(prog(b[1])-prog(a[1])):ord=="rec"?b[1].ultimo-a[1].ultimo:ord=="gasto"?b[1].gasto-a[1].gasto:(a[1].nome||"").localeCompare(b[1].nome||""));
 $("lc").innerHTML=listaClientes(cl)}
function listaClientes(cl){if(!cl.length)return`<p class="mut">Nenhum cliente ainda. Registre o primeiro pedido na aba "Registrar pedido".</p>`;
 return cl.map(([k,c])=>`<div class="cl"><div class="top"><div><b>${esc(c.nome||"Sem nome")}</b><br><small>${esc(fmtTel(c.tel))}</small></div>${livres(c)?`<span class="tag g">${livres(c)} copo(s) grátis</span>`:""}</div>
 <div class="bar"><i style="width:${prog(c)*100/FID}%"></i></div><small>${prog(c)}/${FID} copos no cartão · ${c.copos} copos no total · ${c.resg} resgatado(s)</small><br><small>${c.pedidos} pedido(s) · ${R(c.gasto)} gastos${c.ultimo?" · último: "+quando(c.ultimo):""}</small>
 <div class="acts"><a class="btn s sm" target="_blank" rel="noopener" href="${waLink(c,"Oi "+(c.nome||"")+"! Aqui é do Açaí Imperial.")}">WhatsApp</a>${livres(c)?`<button class="btn sm" onclick="ADM.resgatar('${k}')">Resgatar grátis</button>`:""}<button class="btn s sm" onclick="ADM.ajusta('${k}',1)">+1 copo</button><button class="btn s sm" onclick="ADM.ajusta('${k}',-1)">−1 copo</button>${CLOUD?"":`<button class="btn r sm" onclick="ADM.apagaCli('${k}')">Excluir</button>`}</div></div>`).join("")}
function resgatar(k){if(CLOUD)return CN.resgatar(k);const c=D.clients[k];if(!c||!livres(c))return;if(!confirm(`Resgatar 1 copo grátis de ${c.nome||fmtTel(c.tel)}?`))return;c.resg++;save();render()}
function ajusta(k,d){if(CLOUD)return CN.ajusta(k,d);const c=D.clients[k];c.copos=Math.max(0,c.copos+d);save();T=="clientes"?rClientes():render()}
function apagaCli(k){const c=D.clients[k];if(!confirm(`Excluir ${c.nome||fmtTel(c.tel)} e todo o histórico dele? Os pedidos dele também serão apagados.`))return;D.orders=D.orders.filter(o=>keyTel(o.tel)!=k);delete D.clients[k];save();render()}

function vRegistrar(){return`<h2>Registrar pedido do WhatsApp</h2><p class="mut">Copie a mensagem do pedido que chegou no WhatsApp, cole aqui e toque em “Ler pedido”. O cliente e os copos do cartão fidelidade são atualizados sozinhos.</p><textarea id="adm-msg" placeholder="Cole aqui a mensagem do pedido"></textarea><button class="btn" onclick="ADM.ler()">Ler pedido</button><div id="adm-pv"></div>
<h2>Cadastrar cliente sem pedido</h2><div class="row2"><input id="adm-mn" placeholder="Nome"><input id="adm-mt" type="tel" placeholder="Telefone com DDD"></div><button class="btn s" onclick="ADM.novoCli()">Cadastrar cliente</button>`}
async function ler(){const t=$("msg").value.trim();if(!t)return;const o=lerPedido(t);prev={o,sig:await hash(t)};
 const dup=D.orders.some(x=>x.sig==prev.sig);
 $("pv").innerHTML=`<h2>Confira antes de salvar</h2>${dup?`<p class="err">Atenção: esta mesma mensagem já foi registrada antes.</p>`:""}${o.agendado?`<p class="mut">Pedido agendado (feito com a loja fechada).</p>`:""}<div class="row2"><input id="adm-pn" placeholder="Nome" value="${esc(o.nome)}"><input id="adm-pt" type="tel" placeholder="Telefone" value="${esc(o.tel)}"></div><div class="row2"><input id="adm-pc" type="number" min="0" placeholder="Copos" value="${o.copos}"><input id="adm-pv2" type="number" step="0.01" min="0" placeholder="Total R$" value="${o.total}"></div><p class="mut">${o.itens.map(esc).join("<br>")||"Nenhum item reconhecido: confira o número de copos."}</p><button class="btn" onclick="ADM.salvaPedido()">Salvar pedido</button>`}
function salvaPedido(){if(CLOUD)return CN.salvaPedido();if(!prev)return;const o={id:Date.now().toString(36),ts:Date.now(),nome:$("pn").value.trim(),tel:$("pt").value.trim(),copos:Math.max(0,parseInt($("pc").value)||0),total:Math.max(0,parseFloat($("pv2").value)||0),itens:prev.o.itens,tipo:prev.o.tipo,sig:prev.sig};
 if(keyTel(o.tel).length<10)return alert("Telefone inválido. Digite com DDD.");
 D.orders.unshift(o);aplicar(o,1);save();prev=null;const c=D.clients[keyTel(o.tel)];
 alert(`Pedido salvo!\n${c.nome||fmtTel(c.tel)}: ${prog(c)}/${FID} copos no cartão`+(livres(c)?`\nTem ${livres(c)} copo(s) grátis para resgatar!`:""));tab("clientes")}
function novoCli(){if(CLOUD)return CN.novoCli();const n=$("mn").value.trim(),t=$("mt").value.trim(),k=keyTel(t);if(k.length<10)return alert("Telefone inválido. Digite com DDD.");
 if(D.clients[k])return alert("Esse telefone já está cadastrado.");D.clients[k]={nome:n,tel:t,copos:0,resg:0,gasto:0,pedidos:0,ultimo:0};save();tab("clientes")}

function cardPedido(o){const st=o.status||"confirmado",tg=st=="novo"?'<span class="tag q">Novo</span>':st=="cancelado"?'<span class="tag" style="border:1px solid var(--bad);color:#ffb3b3">Cancelado</span>':'<span class="tag g">Confirmado</span>';
 return`<div class="cl"><div class="top"><div><b>${esc(o.nome||"Sem nome")}</b> ${CLOUD?tg:""}<br><small>${esc(fmtTel(o.tel))} · ${quando(o.ts)}</small></div><b>${R(o.total)}</b></div><small>${o.copos} copo(s)${o.tipo?" · "+esc(o.tipo):""}${o.pagamento?" · Pagamento: "+esc(o.pagamento):""}${o.agendado?" · agendado":""}</small>${o.endereco?`<br><small>${esc(o.endereco)}</small>`:""}<br><small>${(o.itens||[]).map(esc).join(" · ")}</small>${o.obs?`<br><small>Obs: ${esc(o.obs)}</small>`:""}<div class="acts">${CLOUD&&st=="novo"?`<button class="btn sm" onclick="ADM.confirmar('${o.id}')">Confirmar</button><button class="btn r sm" onclick="ADM.cancelar('${o.id}')">Cancelar</button>`:""}<a class="btn s sm" target="_blank" rel="noopener" href="${waLink({tel:o.tel},"Oi "+(o.nome||"")+"! Aqui é do Açaí Imperial.")}">WhatsApp</a><button class="btn r sm" onclick="ADM.apagaPed('${o.id}')">Excluir</button></div></div>`}
function novosBox(){if(!CLOUD)return"";const n=D.orders.filter(o=>o.status=="novo");return`<h2>Pedidos novos (${n.length})</h2>`+(n.length?n.map(cardPedido).join(""):`<p class="mut">Nenhum pedido novo no momento.</p>`)}
function vPedidos(){if(!D.orders.length)return`<h2>Pedidos</h2><p class="mut">Nenhum pedido registrado.</p>`;return`<h2>Pedidos (${D.orders.length})</h2>`+D.orders.slice(0,100).map(cardPedido).join("")}
function apagaPed(id){if(CLOUD)return CN.apagaPed(id);const o=D.orders.find(x=>x.id==id);if(!o||!confirm("Excluir este pedido? Os copos dele saem do cartão fidelidade do cliente."))return;aplicar(o,-1);D.orders=D.orders.filter(x=>x.id!=id);save();render()}

function vBackup(){if(CLOUD)return`<h2>Banco de dados online</h2><p class="mut">Seus pedidos e clientes ficam guardados no Supabase e aparecem em qualquer aparelho em que você entrar.</p><div class="acts"><button class="btn s" onclick="ADM.baixa('csv')">Baixar clientes (.csv)</button><button class="btn r" onclick="ADM.sairNuvem()">Sair da conta</button></div><h2>Trocar PIN deste aparelho</h2><input id="adm-np" type="password" inputmode="numeric" maxlength="8" placeholder="Novo PIN (4 a 8 números)"><button class="btn s" onclick="ADM.trocaPin()">Salvar novo PIN</button>`;return`<h2>Backup</h2><p class="mut">Os dados ficam salvos <b>somente neste aparelho</b>. Baixe um backup de vez em quando e guarde no Google Drive ou mande para você mesma no WhatsApp.</p><div class="acts"><button class="btn" onclick="ADM.baixa('json')">Baixar backup (.json)</button><button class="btn s" onclick="ADM.baixa('csv')">Baixar clientes (.csv)</button></div>
<h2>Restaurar backup</h2><p class="mut">Use para trazer os dados para outro aparelho. Isso substitui o que está salvo aqui.</p><input type="file" accept=".json,application/json" onchange="ADM.restaura(this)">
<h2>Trocar PIN</h2><input id="adm-np" type="password" inputmode="numeric" maxlength="8" placeholder="Novo PIN (4 a 8 números)"><button class="btn s" onclick="ADM.trocaPin()">Salvar novo PIN</button>`}
function baixa(tipo){let txt,nome,mime;const d=new Date().toLocaleDateString("pt-BR",{timeZone:TZ}).replace(/\//g,"-");
 if(tipo=="json"){txt=JSON.stringify(D);nome=`backup-imperial-${d}.json`;mime="application/json"}
 else{txt="\ufeffNome;Telefone;Copos no total;Cartão (x/10);Grátis disponíveis;Resgatados;Pedidos;Gasto total\n"+Object.values(D.clients).map(c=>[c.nome,c.tel,c.copos,prog(c),livres(c),c.resg,c.pedidos,c.gasto.toFixed(2).replace(".",",")].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\n");nome=`clientes-imperial-${d}.csv`;mime="text/csv"}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:mime+";charset=utf-8"}));a.download=nome;document.body.appendChild(a);a.click();a.remove()}
function restaura(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.clients||!x.orders)throw 0;if(!confirm("Substituir os dados deste aparelho pelo backup?"))return;D=x;save();alert("Backup restaurado.");tab("resumo")}catch(e){alert("Arquivo de backup inválido.")}};r.readAsText(f)}
async function trocaPin(){const v=$("np").value.trim();if(!/^\d{4,8}$/.test(v))return alert("Use de 4 a 8 números.");localStorage.setItem(PK,await hash(v));$("np").value="";alert("PIN alterado.")}



window.ADM={confirmar:id=>CN.conf(id,"confirmado"),cancelar:id=>CN.conf(id,"cancelado"),loginNuvem:fazLogin,sairNuvem:CN.sair,abrir,tab,entrar,bloquear,resgatar,ajusta,apagaCli,ler,salvaPedido,novoCli,apagaPed,baixa,restaura,trocaPin,setBusca:v=>{busca=v;rClientes()},setOrd:v=>{ord=v;rClientes()}};
})();
</script></body></html>
